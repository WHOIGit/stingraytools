name: stingraytools
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  # Install one job extra after creating the environment:
  #   pip install ".[sensors]"
  #   pip install ".[images]"
  #   pip install ".[ctd]"
  #   pip install ".[abundance]"
  # For the complete Stingray CLI dependency set:
  #   pip install ".[pipeline]"
  # For local Stingray CLI development:
  #   pip install -e ".[dev]"
