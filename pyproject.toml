[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stingraytools"
version = "3.1.0"
description = "NES-LTER Stingray sensor and image processing tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anh H. Pham" },
]
keywords = [
    "NES-LTER",
    "Stingray",
    "ISIIS",
    "oceanography",
    "sensor-processing",
    "image-processing",
    "ctd",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WHOIGit/stingraytools"
Repository = "https://github.com/WHOIGit/stingraytools"
Issues = "https://github.com/WHOIGit/stingraytools/issues"

[project.scripts]
stingray = "stingray.cli.main:main"

[project.optional-dependencies]
sensors = [
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

images = [
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python",
    "pandas>=2.0",
    "scipy>=1.11",
    "tqdm>=4.64",
]

ctd = [
    "pandas>=2.0",
]

abundance = [
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

pipeline = [
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python",
    "pandas>=2.0",
    "scipy>=1.11",
    "tqdm>=4.64",
]

legacy-tator = [
    "tator",
]

dev = [
    "ipykernel>=6.29",
    "jupyter>=1",
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python",
    "pandas>=2.0",
    "pytest>=8",
    "scipy>=1.11",
    "tqdm>=4.64",
]

[tool.setuptools]
include-package-data = true
packages = [
    "stingray",
    "stingray.cli",
    "stingray.config",
    "stingray.ctd",
    "stingray.images",
    "stingray.io",
    "stingray.logging",
    "stingray.profiles",
    "stingray.sensors",
    "stingray.stats",
    "stingray.utils",
]

[tool.setuptools.package-dir]
stingray = "packages/stingraytools/src/stingray"

[tool.setuptools.package-data]
stingray = [
    "data_reference/*",
]
