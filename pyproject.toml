[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stingraytools"
version = "3.2.0"
description = "NES-LTER Stingray sensor and image processing tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anh H. Pham" },
]
keywords = [
    "NES-LTER",
    "Stingray",
    "ISIIS",
    "oceanography",
    "sensor-processing",
    "image-processing",
    "ctd",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/WHOIGit/stingraytools"
Repository = "https://github.com/WHOIGit/stingraytools"
Issues = "https://github.com/WHOIGit/stingraytools/issues"

[project.scripts]
stingray = "stingray.cli.main:main"

[project.optional-dependencies]
sensors = [
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
]

images = [
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "tqdm>=4.64",
]

ctd = [
    "numpy>=1.26",
    "pandas>=2.0",
]

abundance = [
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
]

pipeline = [
    "stingraytools[images,sensors,ctd,abundance]",
]

dev = [
    "stingraytools[pipeline]",
    "ipykernel>=6.29",
    "jupyter>=1",
    "pytest>=8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stingray*"]

[tool.setuptools.package-data]
stingray = [
    "data_reference/*",
    "config/defaults/*.yaml",
]
