# First-pass quality control, applied to each raw sensor stream before any
# calibration, binning or merging. Values that fail a rule are set to NaN (not
# replaced); the count per column is logged.
#
# One section per sensor stream, named as in the raw data folders. Each column
# lists any of:
#   min / max : values below / above are invalid (a value equal to a limit is kept)
#   invalid   : exact values that mean "no measurement" or a saturated reading
#               (matched to within 0.001)
#
# Limits are fixed, physically based bounds: instrument output range, or values
# that cannot occur in the survey area. They are deliberately loose so they only
# reject impossible values, never extreme-but-real ones. Smaller spikes that stay
# inside these limits are handled by median binning.
#
# Streams are checked on the raw readings, before calibration. A section named
# <stream>_calibrated is a second check on the calibrated column (SUNA_calibrated
# is applied after the nitrate calibration).
#
# Add or change a rule here, or override this file with --config-dir; no code
# change is needed. A stream or column left out is not checked.

CTD:
  Temperature:                # deg C; glitches of thousands of degrees, or 0 with no cell reading
    min: -2
    max: 40
  Salinity:                   # PSU; near-zero values occur when the cell is out of the water
    min: 10
  "Sound Velocity":           # m/s
    min: 1400
    max: 1600

DVL:
  anglePitch:                 # +-90 is a placeholder, not a measured pitch
    invalid: [-90, 90]
  distanceAltitude:           # 9999.99 = no bottom lock (10-20% of rows in a typical cruise)
    invalid: [9999.99]

Fluorometer:
  Backscattering:             # counts; the reading saturates at 4130
    invalid: [4130]

Oxygen: {}

GPS: {}

PAR:
  "Raw PAR [V]":              # normal output is 0-3.7 V; the channel reports ~75-80 V when faulty
    max: 5

SUNA:
  "NitrateConcentration[uM]": # uM; the instrument reports ~2.0e6 on overflow. Raw readings are not negative.
    max: 500

SUNA_calibrated:
  "NitrateConcentration[uM]": # uM; nitrate cannot be negative, small negatives are within instrument noise,
    min: -10                  # and a failed correction can reach about -80
    max: 500
