# Display units of merged sensor columns, keyed by output column name.
# Keep in sync with the dashboard's unit table
# (stingray-dashboard: src/stingray_dashboard/config.py, `unit_patterns`).
# A column missing here simply has no unit.
latitude: "°"
longitude: "°"
pitch: "°"
roll: "°"
heading: "°"
altitude: "m"
temperature: "°C"
conductivity: "S m⁻¹"
pressure: "dbar"
depth: "m"
salinity: "psu"
sound_velocity: "m s⁻¹"
density: "kg m⁻³"
density_ies80: "kg m⁻³"
chlorophyll: "µg l⁻¹"
backscattering: "m⁻¹ sr⁻¹"
par: "µmol photons m⁻² s⁻¹"
oxygen_concentration: "µM"
oxygen_saturation: "%"
nitrate: "µM"
